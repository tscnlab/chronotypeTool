name: Publish chronotype lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.6.43'
      - name: Install system dependency for R rendering packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libuv1-dev
      - name: Cache R rendering packages
        uses: actions/cache@v5
        with:
          path: .R-library
          key: r-ubuntu24.04-${{ runner.arch }}-4.5.0-${{ hashFiles('scripts/setup-r.R') }}
      - name: Install rendering dependencies
        run: npm run setup
      - name: Render and independently verify the Quarto notebooks
        run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: chronotype-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
